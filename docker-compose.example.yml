services:
  digital-twin-integration-server:
    build: .
    image: objectid/digital-twin-integration-server:local
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DTIS_CONFIG: /config/config.yaml
      DTIS_PROFILES_DIRECTORY: /profiles
      DTIS_DATA_DIRECTORY: /data
      DTIS_AUTH_MODE: api-key
      DTIS_API_KEY: ${DTIS_API_KEY:?set DTIS_API_KEY}
    volumes:
      - ./config/config.example.yaml:/config/config.yaml:ro
      - ./profiles:/profiles:ro
      - ./secrets:/secrets:ro
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
