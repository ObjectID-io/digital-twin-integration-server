storage:
  defaultProvider: local
  providers:
    local:
      type: filesystem
      basePath: /data
      uriPrefix: file:///data
    minio:
      type: s3
      endpoint: http://minio:9000
      region: local
      bucket: telemetry
      forcePathStyle: true
      prefix: twins/
      accessKeyEnv: MINIO_ROOT_USER
      secretKeyEnv: MINIO_ROOT_PASSWORD
    nas:
      type: filesystem
      basePath: /mnt/cad
      uriPrefix: nas://plant-storage/cad
  routes:
    dataset: minio
    model: nas
    evidence: local
    artifact: local
    event-payload: local
